<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuzluk</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .heart {
            font-size: 80px;
            cursor: pointer;
            animation: heartbeat 1.2s infinite;
            filter: drop-shadow(0 0 20px #ff0000);
            text-decoration: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        .text {
            position: absolute;
            bottom: 20%;
            color: #333;
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <a href="we.html" class="heart">❤️</a>
    <div class="text">DOKUN</div>

</body>
</html>
