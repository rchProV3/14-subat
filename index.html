<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonsuzluk</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; display: flex; align-items: center; 
            justify-content: center; overflow: hidden; 
        }

        /* Ana Sayfadaki Sabit Kalp */
        .heart {
            font-size: 100px;
            filter: drop-shadow(0 0 20px rgba(255,0,0,0.5));
            user-select: none;
            transition: 0.5s;
        }

        /* Uygulama Modunda Açıldığında Gelecek Yükleme Efekti */
        #loader {
            display: none;
            position: fixed;
            flex-direction: column;
            align-items: center;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 2px solid rgba(212,175,55,0.1);
            border-top: 2px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            margin-top: 15px;
            color: #d4af37;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="heart-view">
        <div class="heart">❤️</div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">Yükleniyor</div>
    </div>

    <script>
        // PWA MODU KONTROLÜ
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if (isStandalone) {
            // Eğer uygulama (PWA) olarak açıldıysa:
            document.getElementById('heart-view').style.display = 'none';
            document.getElementById('loader').style.display = 'flex';

            // 1.5 saniye sonra gizli sayfaya (we.html) yönlendir
            setTimeout(() => {
                window.location.href = "we.html";
            }, 1500);
        }

        // Service Worker (PWA olması için şart)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
